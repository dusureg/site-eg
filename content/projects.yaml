# ─────────────────────────────────────────────────────────────────────────────
# Our Work — one entry per project.  After editing run:  python build.py
#
# Fields
#   id             short English name, lowercase with dashes. Used for the file names below.
#   sector         one of the ids in sectors.yaml
#   titleAr/En     project name
#   descriptionAr/En   one or two sentences (shown on the card)
#   highlightsAr/En    three short points (shown in the preview window)
#   status         concept   -> labelled "Design concept" (3D render / idea, not a delivered job)
#                  completed -> labelled "Completed project"  (use only for real, delivered work)
#   placeholder    the drawing shown until a real photo exists
#                    kind: kitchen | dressing | tv | bath | joinery | restaurant | cafe | shop | cladding | fitout
#                    tone: walnut | ebony | oak | linen | copper | moss
#   image          optional. A file name inside media/projects/.  If you leave it empty, the build
#                  automatically uses media/projects/<id>.jpg (or .png / .webp) when that file exists.
#   previewUrl     optional link for "Open full preview" (a 3D viewer, a PDF, a video ...)
#   downloadUrl    optional. Empty = the build uses files/<id>.pdf (or .zip, .dwg ...) when it exists.
#                  If no file exists the Download button shows a polite "coming soon" state.
#
# To publish a real project:
#   1. copy the photo to   media/projects/<id>.jpg
#   2. copy the brochure to files/<id>.pdf        (optional)
#   3. change   status: concept   to   status: completed
#   4. python build.py
# ─────────────────────────────────────────────────────────────────────────────

