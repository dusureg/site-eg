business:
  title: For restaurants, cafes and shops
  lead: We fit out your commercial space with woodwork made for heavy daily use, on a schedule that respects your opening date.
  cards:
    - t: Restaurants
      items:
        - Counters and reception desks
        - Booths and fixed seating
        - Wall cladding
        - Storage and service units
      alt: Design concept of fixed restaurant seating with pendant lights
    - t: Cafes
      items:
        - Coffee bars and counters
        - Display and product shelving
        - Wooden tables and seating
        - Interiors that express the place's identity
      alt: Design concept of a wooden coffee bar with back shelves
    - t: Shops
      items:
        - Display shelving and showcases
        - Checkout counters
        - Fitting rooms and stockrooms
        - Units designed around your brand
      alt: Design concept of a shop display wall and checkout counter
  band:
    - t: A quote with clear line items
      d: Prepared from your drawings or site measurements, so you know what each item costs.
    - t: A written work schedule
      d: Stages and delivery dates agreed before work begins.
    - t: Installation coordinated with you
      d: We set installation times that suit how your business runs.
  cta: Request a quote for your business
  wa: Hello Dusur, I have a commercial project (restaurant / cafe / shop) and would like a quote

contracting:
  title: Joinery & contracting
  lead: We work with contractors, developers and design offices to supply and build the woodwork in their projects.
  cards:
    - t: Joinery works
      items:
        - Wooden doors and frames
        - Wall and ceiling cladding
        - Built-in wardrobes and cabinets
        - Desks and office fit-out
        - Special pieces to your specification and drawings
      alt: Design concept of slatted wall cladding with a flush door
    - t: Contracting and finishing
      items:
        - Woodwork delivered within finishing packages
        - Coordination with other trades on site
        - Quality and schedule follow-up
        - Handover against a clear item list
      alt: Fit-out plan of a commercial space with dimensions and furniture layout
  cta: Send your project drawings
  wa: Hello Dusur, I have a contracting project and would like a price for the joinery works

process:
  title: How we work
  lead: Four clear steps, and you always know what comes next.
  steps:
    - t: Site visit and measuring
      d: We visit the site and take accurate measurements.
    - t: 3D design
      d: You review and adjust the design before work begins.
    - t: Build and follow-up
      d: We follow production and check quality before anything ships.
    - t: Installation and handover
      d: We install and hand over on the agreed date.

