hero:
  title: Details built to last
  text: Dusur makes custom woodwork — kitchens, dressing rooms, TV units, bathroom units and joinery. We measure, design and follow the build through to installation, with one team accountable to you.
  cta: Chat on WhatsApp
  cta2: See our services
  art: Drawing of an interlocking wooden joint, the dusur

why:
  title: Why Dusur
  lead: Four commitments behind every project.
  items:
    - t: Materials built for daily use
      d: We choose surfaces and hardware for how you will actually use them.
    - t: Precise workmanship
      d: We inspect parts and assembly before anything leaves for your site.
    - t: Made to your measurements
      d: Layout, colour and storage follow your space and your habits.
    - t: One team accountable
      d: From measuring to installation, you deal with a single team.

services:
  title: What we make
  lead: Five lines of woodwork, designed around your space and the way you live.
  items:
    - t: Wood kitchens
      d: Practical layouts, base and wall units, and hardware chosen for everyday use.
      alt: Design concept of a custom wood kitchen with wall and base units
    - t: Dressing rooms
      d: An interior planned around your clothes and accessories, with doors, drawers and lighting.
      alt: Design concept of a dressing room with doors, drawers and hanging zones
    - t: TV units
      d: Walls and units that hide the cables and give you tidy storage and display.
      alt: Design concept of a wood TV wall with a storage unit and shelves
    - t: Bathroom units
      d: Storage units and basins in materials that cope with moisture.
      alt: Design concept of a wood bathroom vanity with a basin and mirror
    - t: Custom joinery
      d: Doors, desks, shelving and any wooden piece made to your brief.
      alt: Design concept of a wooden door and built-in bookcase

