why:
  title: لماذا دسر
  lead: أربعة التزامات نبني عليها كل مشروع.
  items:
    - t: خامات تتحمل الاستخدام
      d: نختار الأسطح والإكسسوارات حسب طبيعة الاستخدام اليومي.
    - t: تنفيذ دقيق
      d: نفحص القطع والتجميع قبل خروجها إلى موقعك.
    - t: مصمم على مقاسك
      d: التقسيم والألوان والتخزين حسب مساحتك وعاداتك.
    - t: جهة واحدة مسؤولة
      d: من القياس إلى التركيب، تتواصل مع فريق واحد.

services:
  title: ما نصنعه
  lead: خمس فئات من الأعمال الخشبية، مصممة على مقاس مساحتك واحتياجك.
  items:
    - t: مطابخ خشبية
      d: تخطيط عملي، وحدات أرضية وعلوية، وأدوات تشغيل مناسبة للاستخدام اليومي.
      alt: تصور لمطبخ خشبي مخصص بوحدات علوية وسفلية
    - t: غرف الملابس
      d: تقسيم داخلي حسب ملابسك وإكسسواراتك، بأبواب وأدراج وإضاءة.
      alt: تصور لغرفة ملابس بأبواب وأدراج ومناطق تعليق
    - t: وحدات التلفاز
      d: حوائط وتركيبات تخفي الأسلاك وتوفر تخزينًا وعرضًا منظمًا.
      alt: تصور لحائط تلفاز خشبي مع وحدة تخزين ورفوف
    - t: وحدات الحمامات
      d: وحدات تخزين وأحواض بخامات تتحمل الرطوبة.
      alt: تصور لوحدة حمام خشبية مع حوض ومرآة
    - t: نجارة مخصصة
      d: أبواب، مكاتب، رفوف وأي قطعة خشبية تصمم حسب طلبك.
      alt: تصور لباب خشبي ومكتبة مدمجة

work:
  title: أعمالنا
  lead: تصاميم ومشاريع مقسّمة حسب القسم. اضغط «معاينة» لرؤية التفاصيل، أو «تحميل» عند توفر ملف المشروع.
  all: الكل
  count: "المعروض: {n}"
  preview: معاينة
  download: تحميل
  soon: قريبًا
  soon_toast: ملف هذا المشروع غير متاح بعد، وسيُضاف قريبًا.
  concept: تصور تصميمي
  completed: مشروع منفّذ
  concept_note: هذا تصور تصميمي من دسر يوضح أسلوبنا، وليس مشروعًا منفّذًا. ستحل صور الأعمال المنفذة محله فور اكتمالها.
  highlights: أبرز التفاصيل
  open_external: فتح المعاينة الكاملة
  ask: اسأل عن مشروع مشابه
  ask_msg: "مرحبا دسر، أريد الاستفسار عن مشروع مشابه لـ: {title}"
  empty: لا توجد مشاريع في هذا القسم حاليًا.

business:
  title: للمطاعم والكافيهات والمحلات
  lead: نجهز مساحتك التجارية بأعمال خشبية مصممة للاستخدام اليومي المكثف، وبجدول تنفيذ يراعي موعد افتتاحك.
  cards:
    - t: المطاعم
      items:
        - كاونترات واستقبال
        - كبائن وجلسات ثابتة
        - تكسيات حوائط
        - وحدات تخزين وخدمة
      alt: تصور لجلسات ثابتة في مطعم مع إضاءة معلّقة
    - t: الكافيهات
      items:
        - بارات وكاونترات قهوة
        - أرفف عرض ومنتجات
        - طاولات ومقاعد خشبية
        - ديكورات تعبّر عن هوية المكان
      alt: تصور لبار قهوة خشبي مع أرفف خلفية
    - t: المحلات
      items:
        - أرفف وفاترينات عرض
        - كاونترات دفع
        - غرف قياس ومخازن
        - وحدات بتصميم يناسب علامتك
      alt: تصور لحائط عرض وكاونتر دفع في محل
  band:
    - t: عرض سعر ببنود واضحة
      d: نجهزه من المخططات أو القياسات، لتعرف تكلفة كل بند.
    - t: جدول تنفيذ مكتوب
      d: مراحل وتواريخ تسليم متفق عليها قبل البدء.
    - t: تركيب بالتنسيق معك
      d: نحدد معك مواعيد التركيب بما يناسب سير عملك.
  cta: اطلب عرض سعر لمشروعك التجاري
  wa: مرحبا دسر، لدي مشروع تجاري (مطعم / كافيه / محل) وأريد عرض سعر

contracting:
  title: نجارة ومقاولات
  lead: نتعاون مع المقاولين والمطورين والمكاتب الهندسية في توريد وتنفيذ الأعمال الخشبية ضمن مشاريعهم.
  cards:
    - t: أعمال النجارة
      items:
        - أبواب وحلوق خشبية
        - تكسيات حوائط وأسقف خشبية
        - دواليب وخزائن مدمجة
        - مكاتب وتجهيزات إدارية
        - قطع خاصة حسب المواصفات والرسومات
      alt: تصور لتكسية حائط بشرائح خشبية مع باب مدمج
    - t: أعمال المقاولات والتشطيب
      items:
        - تنفيذ الأعمال الخشبية ضمن أعمال التشطيب
        - التنسيق مع باقي الأعمال في الموقع
        - متابعة الجودة والمواعيد
        - استلام وتسليم بقائمة بنود واضحة
      alt: مخطط تجهيز مساحة تجارية بأبعاد وتوزيع للأثاث
  cta: أرسل مخططات مشروعك
  wa: مرحبا دسر، لدي مشروع مقاولات وأريد تسعير أعمال النجارة

process:
  title: طريقة العمل
  lead: أربع خطوات واضحة، وتعرف في كل مرحلة ما سيحدث بعدها.
  steps:
    - t: المعاينة والقياس
      d: نزور الموقع ونأخذ المقاسات بدقة.
    - t: التصميم ثلاثي الأبعاد
      d: تراجع التصميم وتعدّله قبل بدء التنفيذ.
    - t: التنفيذ والمتابعة
      d: نتابع الإنتاج ونفحص الجودة قبل خروج العمل.
    - t: التركيب والتسليم
      d: نركّب ونسلّم في الموعد المكتوب.

